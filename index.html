<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Strażnik parkingu</title>
<style>
  body{margin:0;background:#111;color:#eee;font:16px -apple-system,system-ui,sans-serif}
  #wrap{position:relative}
  video{width:100%;display:block;background:#000;min-height:40px}
  #ov{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  .bar{padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  button,input[type=text]{font:inherit;padding:8px 12px;border-radius:8px;border:0}
  button{background:#2b6;color:#fff}
  input[type=text]{flex:1;min-width:0}
  #log{padding:0 16px 24px;font-size:13px;white-space:pre-wrap;color:#aaa}
</style>
</head>
<body>
<div id="wrap"><video id="v" playsinline muted autoplay></video><canvas id="ov"></canvas></div>
<div class="bar">
  <input id="topic" type="text" placeholder="temat ntfy, np. parking-x7k2q" autocapitalize="off" autocorrect="off">
  <button id="test">Test</button>
</div>
<div class="bar">
  <button id="start">▶ Start kamery</button>
  <button id="clear">Wyczyść miejsca</button>
  <label>Próg <input id="thr" type="range" min="5" max="60" value="20"></label><b id="thrv"></b>
</div>
<div id="log">1. Wpisz temat ntfy i kliknij Test.
2. Start kamery, potem przeciągnij palcem po ZAJĘTYM miejscu, żeby je zaznaczyć.
Liczba przy miejscu = zmiana obrazu. Ustaw próg powyżej liczby, gdy nic się nie dzieje.</div>
<script>
const W = 160, HOLD = 15; // analysis width in px; seconds a change must last (people walking by are shorter)
const $ = id => document.getElementById(id);
const v = $('v'), ov = $('ov'), ctx = ov.getContext('2d');
const work = document.createElement('canvas'), wctx = work.getContext('2d', {willReadFrequently: true});
let spots = JSON.parse(localStorage.spots || '[]'), drag = null;
$('topic').value = localStorage.topic || '';
$('topic').onchange = () => localStorage.topic = $('topic').value.trim();
$('thr').value = localStorage.thr || 20;
$('thrv').textContent = $('thr').value;
$('thr').oninput = () => { localStorage.thr = $('thrv').textContent = $('thr').value; };

function log(m) { $('log').textContent = new Date().toLocaleTimeString() + ' ' + m + '\n' + $('log').textContent.slice(0, 3000); }
function save() { localStorage.spots = JSON.stringify(spots.map(({x, y, w, h}) => ({x, y, w, h}))); }

function notify(msg) {
  const t = $('topic').value.trim();
  if (!t) return log('Brak tematu ntfy!');
  fetch('https://ntfy.sh/' + encodeURIComponent(t), {method: 'POST', body: msg, headers: {Title: 'Parking', Priority: 'high', Tags: 'car'}})
    .then(r => log(r.ok ? 'Wysłano: ' + msg : 'Błąd ntfy ' + r.status))
    .catch(() => { log('Brak sieci, ponawiam za 30 s'); setTimeout(() => notify(msg), 30000); });
}

// RGB minus per-channel mean, so sun/cloud brightness changes mostly cancel out
function feat(d) {
  const n = d.length / 4, f = new Float32Array(n * 3), m = [0, 0, 0];
  for (let i = 0; i < n; i++) for (let c = 0; c < 3; c++) m[c] += f[i * 3 + c] = d[i * 4 + c];
  for (let i = 0; i < f.length; i++) f[i] -= m[i % 3] / n;
  return f;
}
function diff(a, b) { let s = 0; for (let i = 0; i < a.length; i++) s += Math.abs(a[i] - b[i]); return s / a.length; }
// returns 'free' / 'taken' once the spot looks different from its reference for HOLD ticks in a row
function step(s, cur, thr) {
  s.d = diff(s.ref, cur);
  if (s.d < thr) { s.n = 0; for (let i = 0; i < cur.length; i++) s.ref[i] = s.ref[i] * 0.9 + cur[i] * 0.1; return null; }
  if (++s.n < HOLD) return null;
  s.n = 0; s.ref = cur; s.free = !s.free;
  return s.free ? 'free' : 'taken';
}

function tick() {
  if (!v.videoWidth) return;
  work.width = W; work.height = Math.round(W * v.videoHeight / v.videoWidth);
  wctx.drawImage(v, 0, 0, work.width, work.height);
  const thr = +$('thr').value;
  spots.forEach((s, i) => {
    const x = Math.floor(s.x * work.width), y = Math.floor(s.y * work.height);
    const cur = feat(wctx.getImageData(x, y, Math.max(1, Math.round(s.w * work.width)), Math.max(1, Math.round(s.h * work.height))).data);
    if (!s.ref || s.ref.length !== cur.length) { s.ref = cur; s.n = 0; return; }
    const e = step(s, cur, thr);
    if (e === 'free') notify(`Miejsce ${i + 1} się zwolniło!`);
    if (e === 'taken') log(`Miejsce ${i + 1} znowu zajęte`);
  });
  draw();
}

function draw() {
  const r = ov.getBoundingClientRect(), dpr = devicePixelRatio;
  ov.width = r.width * dpr; ov.height = r.height * dpr;
  ctx.scale(dpr, dpr); ctx.lineWidth = 3; ctx.font = 'bold 16px sans-serif';
  const box = (s, col, label) => {
    ctx.strokeStyle = ctx.fillStyle = col;
    ctx.strokeRect(s.x * r.width, s.y * r.height, s.w * r.width, s.h * r.height);
    if (label) ctx.fillText(label, s.x * r.width + 4, s.y * r.height + 18);
  };
  spots.forEach((s, i) => box(s, s.free ? '#2e6' : '#f44', `${i + 1}${s.d != null ? ' · ' + s.d.toFixed(0) : ''}${s.n ? ' ⏳' + s.n : ''}`));
  if (drag) box(rect(drag), '#ff0');
}

function pt(e) { const r = ov.getBoundingClientRect(); return {x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height}; }
function rect(d) { return {x: Math.min(d.x0, d.x), y: Math.min(d.y0, d.y), w: Math.abs(d.x - d.x0), h: Math.abs(d.y - d.y0)}; }
ov.onpointerdown = e => { const p = pt(e); drag = {x0: p.x, y0: p.y, ...p}; };
ov.onpointermove = e => { if (drag) { Object.assign(drag, pt(e)); draw(); } };
ov.onpointerup = ov.onpointercancel = () => {
  const r = drag && rect(drag); drag = null;
  if (r && r.w > 0.02 && r.h > 0.02) { spots.push(r); save(); log(`Dodano miejsce ${spots.length} (zajęte)`); }
  draw();
};

$('clear').onclick = () => { spots = []; save(); draw(); };
$('test').onclick = () => { localStorage.topic = $('topic').value.trim(); notify('Test – działa 👍'); };

let lock = null;
const keepAwake = () => navigator.wakeLock?.request('screen').then(l => lock = l).catch(() => {});
document.addEventListener('visibilitychange', () => { if (!document.hidden && v.srcObject) { keepAwake(); v.play(); } });
$('start').onclick = async () => {
  try {
    v.srcObject = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment', width: 1280}, audio: false});
    await v.play(); keepAwake();
    setInterval(tick, 1000);
    $('start').disabled = true; log('Kamera działa. Nie blokuj ekranu.');
  } catch (e) { log('Kamera niedostępna: ' + e.message + ' (strona musi być przez https)'); }
};
window.onresize = draw;

// self-check: an occupied spot flips to free only after HOLD changed ticks
(() => {
  const s = {ref: new Float32Array([1, -1]), n: 0, free: false}, c = new Float32Array([-1, 1]); let e;
  for (let i = 0; i < HOLD - 1; i++) console.assert(step(s, c, 0.5) === null, 'flipped too early');
  e = step(s, c, 0.5);
  console.assert(e === 'free' && s.free, 'step should report free');
  console.assert(step(s, c, 0.5) === null && s.n === 0, 'stable after flip');
})();
</script>
</body>
</html>
